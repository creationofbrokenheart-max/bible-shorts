name: Daily Bible Shorts

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  generate-short:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (select, fetch, LLM, image, TTS, video)
        env:
          BIBLE_API_BASE: "https://bible-api.com"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_T2I_MODEL: "Tongyi-MAI/Z-Image"
          CAMB_API_KEY: ${{ secrets.CAMB_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIDEO_FONT_PATH: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
        run: |
          python scripts/select_verse.py
          python scripts/fetch_verse_text.py
          python scripts/llm_summarize_translate.py
          python scripts/gen_image.py
          python scripts/gen_tts.py
          python scripts/gen_video.py
      - name: Upload generated media
        uses: actions/upload-artifact@v4
        with:
          name: bible-short
          path: |
            outputs/images
            outputs/audio
            outputs/videos
            current_verse.json
